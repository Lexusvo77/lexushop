} catch (error) {

========================================= */

/* =========================================

========================================= */

function startShop(){

  const welcome =
  document.getElementById("welcome");

  if (!welcome) {

    console.error(
      "No se encontró el elemento #welcome."
    );

    return;

  }


  welcome.classList.add("hide");


  setTimeout(function(){

    welcome.style.display = "none";

  }, 550);


  goShop();

}


/* =========================================
   NAVEGACIÓN
========================================= */

function goHome(){

  document
  .getElementById("home")
  .scrollIntoView({
    behavior:"smooth"
  });

}


function goShop(){

  document
  .getElementById("shop")
  .scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================================
   CATEGORÍAS
========================================= */

function showCategory(category,button){

  let list;


  if(category === "Todos"){

    list =
    products.filter(
      p => p.category !== "Gorras"
    );

  }else{

    list =
    products.filter(
      p => p.category === category
    );

  }


  document.getElementById("brands")
  .style.display =
  "none";


  document.getElementById("backBrands")
  .style.display =
  "none";


  document.querySelectorAll(".category")
  .forEach(
    b =>
    b.classList.remove("active")
  );


  button.classList.add("active");


  showProducts(list);

}


function showCaps(button){

  document.getElementById("products")
  .innerHTML = "";


  document.getElementById("brands")
  .style.display =
  "grid";


  document.getElementById("backBrands")
  .style.display =
  "none";


  document.querySelectorAll(".category")
  .forEach(
    b =>
    b.classList.remove("active")
  );


  button.classList.add("active");

}


function showBrand(brand){

  document.getElementById("brands")
  .style.display =
  "none";


  document.getElementById("backBrands")
  .style.display =
  "block";


  let list =
  products.filter(
    p =>
    p.category === "Gorras" &&
    p.brand === brand
  );


  showProducts(list);

}


function backToBrands(){

  document.getElementById("products")
  .innerHTML = "";


  document.getElementById("backBrands")
  .style.display =
  "none";


  document.getElementById("brands")
  .style.display =
  "grid";

}


/* =========================================
   PRODUCTOS
========================================= */

function showProducts(list){

  const box =
  document.getElementById("products");

  box.innerHTML = "";


  if(!list.length){

    box.innerHTML =
    '<p class="empty">No hay productos disponibles.</p>';

    return;

  }


  list.forEach(product => {

    const index =
    products.indexOf(product);


    box.innerHTML += `

      <article class="product">

        <div class="product-img">

          <img
          src="${product.image}"
          alt="${product.name}">

        </div>


        <div class="product-info">

          <h3>
            ${product.name}
          </h3>

          <p>
            ${product.description}
          </p>

          <p class="price">
            Q${Number(product.price).toFixed(2)}
          </p>


          <button
          class="btn"
          onclick="addToCart(${index})">

            AGREGAR AL CARRITO

          </button>

        </div>

      </article>

    `;

  });

}


/* =========================================
   CARRITO
========================================= */

function addToCart(index){

  cart.push(
    products[index]
  );

  renderCart();

  openCart();

}


function renderCart(){

  const box =
  document.getElementById("cartItems");

  let total = 0;

  box.innerHTML = "";


  if(!cart.length){

    box.innerHTML =
    '<p class="empty">Tu carrito está vacío.</p>';

  }


  cart.forEach((p,i)=>{

    total +=
    Number(p.price);


    box.innerHTML += `

      <div class="cart-item">

        <img src="${p.image}">

        <div>

          <strong>
            ${p.name}
          </strong>

          <p>
            Q${Number(p.price).toFixed(2)}
          </p>

        </div>


        <button
        onclick="removeFromCart(${i})">

          ×

        </button>

      </div>

    `;

  });


  document.getElementById("cartCount")
  .textContent =
  cart.length;


  document.getElementById("cartTotal")
  .textContent =
  "Q" + total.toFixed(2);

}


function removeFromCart(i){

  cart.splice(i,1);

  renderCart();

}


function openCart(){

  renderCart();

  document
  .getElementById("cartModal")
  .classList
  .add("open");

}


function closeCart(){

  document
  .getElementById("cartModal")
  .classList
  .remove("open");

}


/* =========================================
   PAGO
========================================= */

function openPayment(){

  if(!cart.length){

    alert(
      "Tu carrito está vacío."
    );

    return;

  }


  closeCart();

  selectedPayment = "";


  document
  .getElementById("paymentModal")
  .classList
  .add("open");

}


function closePayment(){

  document
  .getElementById("paymentModal")
  .classList
  .remove("open");

}


function selectPayment(payment){

  selectedPayment =
  payment;


  alert(
    "Forma de pago seleccionada: " +
    payment
  );

}


function sendWhatsApp(){

  if(!cart.length){

    alert(
      "Tu carrito está vacío."
    );

    return;

  }


  if(!selectedPayment){

    alert(
      "Primero selecciona una forma de pago."
    );

    return;

  }


  let total = 0;


  let message =
  "Hola, quiero realizar un pedido en " +
  settings.brand +
  ".%0A%0A";


  message +=
  "PRODUCTOS:%0A";


  cart.forEach((p,i)=>{

    total +=
    Number(p.price);


    message +=
    (i+1) +
    ". " +
    p.name +
    " - Q" +
    Number(p.price).toFixed(2) +
    "%0A";

  });


  message +=
  "%0ATOTAL: Q" +
  total.toFixed(2);


  message +=
  "%0AFORMA DE PAGO: " +
  selectedPayment;


  message +=
  "%0A%0AQuedo pendiente para completar mi compra.";


  window.open(
    "https://wa.me/" +
    settings.whatsapp +
    "?text=" +
    message,
    "_blank"
  );

}

function addProduct(){

    name:"Nuevo producto",

    category:"Camisas",

    brand:"",

    description:

    price:0,

    image:
    "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"

  });


  renderAdminProducts();

}


function deleteProduct(i){

  if(
    confirm("¿Eliminar este producto?")
  ){

    products.splice(i,1);

    renderAdminProducts();

  }

}

   GUARDAR CONFIGURACIÓN
========================================= */

function saveSettings(){

  settings = {

    brand:
    document.getElementById("setBrand").value
    || "LEXUS",


    heroTitle:
    document.getElementById("setHeroTitle").value
    || "LEXUS",


    heroText:
    document.getElementById("setHeroText").value
    || "",


    welcomeText:
    document.getElementById("setWelcomeText").value
    || "",


    heroBg:
    document.getElementById("setHeroBg").value
    || DEFAULT_SETTINGS.heroBg,


    welcomeBg:
    document.getElementById("setWelcomeBg").value
    || DEFAULT_SETTINGS.welcomeBg,


    whatsapp:
    document
    .getElementById("setWhatsapp")
    .value
    .replace(/\D/g,"")
    || "50236891432",


    tiktok:
    document.getElementById("setTiktok").value
    || DEFAULT_SETTINGS.tiktok,


    instagram:
    document.getElementById("setInstagram").value
    || DEFAULT_SETTINGS.instagram

  };};


  localStorage.setItem(localStorage.setItem(
    "lexusSettings","lexusSettings",
    JSON.stringify(settings)JSON.stringify(settings)
  ););


  localStorage.setItem(localStorage.setItem(
    "lexusProducts","lexusProducts",
    JSON.stringify(products)JSON.stringify(products)
  ););


  applySettings();applySettings();


  showProducts(showProducts(
    products.filter(products.filter(
      p => p.category !== "Gorras"p => p.category !== "Gorras"
    ))
  ););


  alert(alert(
     "¡Cambios guardados correctamente!" "¡Cambios guardados correctamente!""¡Cambios guardados correctamente!" "¡Cambios guardados correctamente!" "¡Cambios guardados correctamente!" 
  ););


  closeSettings();closeSettings();

}

try {

} catch(error) {

  console.error(
     "Error al iniciar la página:", 
    error
  );

}
